<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CutForge Studio — Multi-Clip MP4 Video Editor</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #09090b; color: #f4f4f5; min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: #121215; border-bottom: 1px solid #27272a; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .brand { font-weight: 700; font-size: 18px; }
    .brand span { color: #818cf8; }
    .container { max-width: 1100px; width: 94%; margin: 24px auto; display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    h2 { font-size: 13px; text-transform: uppercase; color: #818cf8; letter-spacing: 0.5px; }
    label { font-size: 12px; color: #a1a1aa; display: block; margin-bottom: 4px; }
    input, select {
      width: 100%; background: #09090b; border: 1px solid #3f3f46; color: #fff;
      padding: 9px; border-radius: 8px; font-size: 13px;
    }
    .btn {
      padding: 11px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600;
      cursor: pointer; background: #4f46e5; color: white; transition: 0.15s;
    }
    .btn:hover:not(:disabled) { background: #4338ca; }
    .btn:disabled { background: #3f3f46; cursor: not-allowed; opacity: 0.7; }
    .btn-sm { padding: 5px 9px; font-size: 11px; background: #27272a; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
    .btn-danger { background: #dc2626; }
    .clip-list { display: flex; flex-direction: column; gap: 8px; }
    .clip-row {
      background: #09090b; border: 1px solid #27272a; border-radius: 8px; padding: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px;
    }
    video { width: 100%; border-radius: 10px; background: #000; border: 1px solid #27272a; max-height: 460px; }
    #status { font-size: 13px; color: #a5b4fc; background: #1e1b4b; padding: 10px 14px; border-radius: 8px; border: 1px solid #3730a3; }
    @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <div class="brand">🎬 Cut<span>Forge</span> — True Multi-Clip MP4 Merger & Editor</div>
  <button class="btn" id="renderBtn" onclick="clubAndExport()" disabled>⬇ Club & Export Final MP4</button>
</header>

<div class="container">
  <!-- LEFT CONTROLS -->
  <div style="display:flex; flex-direction:column; gap:16px;">
    <div class="card">
      <h2>1. Add Multiple Videos to Club</h2>
      <label>Select 2 or more videos (or add one by one)</label>
      <input type="file" id="filePicker" accept="video/*" multiple />
      <div class="clip-list" id="clipList"></div>
    </div>

    <div class="card">
      <h2>2. Format, Color & Audio Settings</h2>
      <div>
        <label>Output Resolution & Aspect Ratio</label>
        <select id="resolution">
          <option value="1280:720">YouTube 16:9 (1280×720 HD)</option>
          <option value="1920:1080">YouTube 16:9 (1920×1080 Full HD)</option>
          <option value="720:1280">Reels / Shorts 9:16 (720×1280)</option>
          <option value="1080:1920">Reels / Shorts 9:16 (1080×1920)</option>
        </select>
      </div>
      <div>
        <label>Playback Speed</label>
        <select id="speed">
          <option value="1">1.0x Normal Speed</option>
          <option value="0.75">0.75x Smooth Slow-Mo</option>
          <option value="1.25">1.25x Crisp Creator Pace</option>
          <option value="1.5">1.5x Fast Recap</option>
        </select>
      </div>
      <div>
        <label>Color Grade Preset</label>
        <select id="colorGrade">
          <option value="none">Original Colors</option>
          <option value="eq=contrast=1.18:saturation=1.25">High-Retention Vibrant</option>
          <option value="eq=contrast=1.22:brightness=-0.03:saturation=1.15">Cinematic Contrast</option>
          <option value="hue=s=0">Noir Black & White</option>
        </select>
      </div>
      <div>
        <label>Optional Background Music (MP3/WAV)</label>
        <input type="file" id="musicPicker" accept="audio/*" />
      </div>
    </div>
  </div>

  <!-- RIGHT PREVIEW & OUTPUT -->
  <div style="display:flex; flex-direction:column; gap:16px;">
    <div id="status">Upload your video clips on the left to club them into a single MP4.</div>
    <div class="card">
      <h2>Final Export Preview</h2>
      <video id="outputPlayer" controls></video>
    </div>
  </div>
</div>

<script>
  const { FFmpeg } = FFmpegWASM;
  const { fetchFile } = FFmpegUtil;
  const ffmpeg = new FFmpeg();

  let clipFiles = [];
  let musicFile = null;

  document.getElementById('filePicker').addEventListener('change', (e) => {
    const newlyAdded = Array.from(e.target.files);
    clipFiles.push(...newlyAdded);
    e.target.value = '';
    renderClipList();
  });

  document.getElementById('musicPicker').addEventListener('change', (e) => {
    musicFile = e.target.files[0] || null;
  });

  function renderClipList() {
    const list = document.getElementById('clipList');
    list.innerHTML = '';
    clipFiles.forEach((file, idx) => {
      const row = document.createElement('div');
      row.className = 'clip-row';
      row.innerHTML = `
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:165px;">
          <strong>#${idx + 1}</strong> ${file.name}
        </span>
        <div style="display:flex; gap:4px;">
          <button class="btn-sm" onclick="moveClip(${idx}, -1)">↑</button>
          <button class="btn-sm" onclick="moveClip(${idx}, 1)">↓</button>
          <button class="btn-sm btn-danger" onclick="removeClip(${idx})">✕</button>
        </div>
      `;
      list.appendChild(row);
    });
    document.getElementById('renderBtn').disabled = clipFiles.length === 0;
  }

  function moveClip(idx, dir) {
    const target = idx + dir;
    if (target < 0 || target >= clipFiles.length) return;
    [clipFiles[idx], clipFiles[target]] = [clipFiles[target], clipFiles[idx]];
    renderClipList();
  }

  function removeClip(idx) {
    clipFiles.splice(idx, 1);
    renderClipList();
  }

  async function clubAndExport() {
    if (!clipFiles.length) return;
    const btn = document.getElementById('renderBtn');
    const status = document.getElementById('status');
    btn.disabled = true;

    try {
      if (!ffmpeg.loaded) {
        status.textContent = 'Loading FFmpeg video engine (one-time ~25MB download)...';
        await ffmpeg.load({
          coreURL: 'https://unpkg.com',
        });
      }

      const [targetW, targetH] = document.getElementById('resolution').value.split(':');
      const speed = parseFloat(document.getElementById('speed').value);
      const colorGrade = document.getElementById('colorGrade').value;

      // Normalize every clip to identical resolution, FPS, and audio sample rate so clubbing never fails
      const normalizedNames = [];
      for (let i = 0; i < clipFiles.length; i++) {
        status.textContent = `Processing & matching clip ${i + 1} of ${clipFiles.length}...`;
        const rawName = `raw_${i}.mp4`;
        const normName = `norm_${i}.mp4`;
        await ffmpeg.writeFile(rawName, await fetchFile(clipFiles[i]));

        let vf = `scale=${targetW}:${targetH}:force_original_aspect_ratio=decrease,pad=${targetW}:${targetH}:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30`;
        if (speed !== 1) vf += `,setpts=${(1 / speed).toFixed(3)}*PTS`;
        if (colorGrade !== 'none') vf += `,${colorGrade}`;

        const af = speed !== 1 ? `atempo=${speed}` : `anull`;

        await ffmpeg.exec([
          '-i', rawName,
          '-vf', vf,
          '-af', af,
          '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23',
          '-c:a', 'aac', '-ar', '44100', '-ac', '2',
          normName
        ]);
        normalizedNames.push(normName);
      }

      // Club all normalized clips together using FFmpeg concat demuxer
      status.textContent = 'Clubbing all clips into final MP4...';
      const concatList = normalizedNames.map(n => `file '${n}'`).join('\n');
      await ffmpeg.writeFile('list.txt', concatList);

      await ffmpeg.exec([
        '-f', 'concat', '-safe', '0',
        '-i', 'list.txt',
        '-c', 'copy',
        'clubbed.mp4'
      ]);

      let finalFile = 'clubbed.mp4';

      // Mix background music if uploaded
      if (musicFile) {
        status.textContent = 'Mixing background music with video audio...';
        await ffmpeg.writeFile('bgm.mp3', await fetchFile(musicFile));
        await ffmpeg.exec([
          '-i', 'clubbed.mp4',
          '-stream_loop', '-1', '-i', 'bgm.mp3',
          '-filter_complex', '[0:a]volume=1.0[a1];[1:a]volume=0.22[a2];[a1][a2]amix=inputs=2:duration=first[aout]',
          '-map', '0:v', '-map', '[aout]',
          '-c:v', 'copy', '-c:a', 'aac',
          'final_with_music.mp4'
        ]);
        finalFile = 'final_with_music.mp4';
      }

      const data = await ffmpeg.readFile(finalFile);
      const mp4Url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

      const player = document.getElementById('outputPlayer');
      player.src = mp4Url;

      const a = document.createElement('a');
      a.href = mp4Url;
      a.download = 'CutForge-Clubbed-Video.mp4';
      a.click();
